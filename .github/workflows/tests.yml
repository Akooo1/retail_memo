name: retail-kpi tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retail-kpi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: retail-kpi/requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Build the synthetic mart (README command)
        run: python -m retail_kpi --out build
      - name: Run tests
        run: pytest
